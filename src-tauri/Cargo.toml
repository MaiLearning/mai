[package]
name = "mai"
version = "0.1.0"
description = "The backend for the Mai application uses Tauri as the main framework."
authors = ["GILGANSH"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri-plugin-pilot — dev-инструмент AI-тестирования UI (tauri-pilot).
# Собирается только с фичей: `tauri dev --features pilot`.
pilot = ["dep:tauri-plugin-pilot"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }
rusqlite = "0.32"
async-trait = "0.1"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

