name: release-windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup обязан идти ДО setup-node: при cache: pnpm setup-node
      # вызывает `pnpm store path` и без установленного pnpm падает.
      # Версию берёт из packageManager в package.json — если задать ещё и
      # with.version, action падает с «Multiple versions of pnpm specified».
      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mai ${{ github.ref_name }}'
          releaseBody: |
            Первый публичный релиз Mai.
          releaseDraft: true
          prerelease: true